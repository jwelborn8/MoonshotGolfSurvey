<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Scramble Golf Survey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px auto;
      max-width: 600px;
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      display: block;
      width: 100%;
    }
    #message {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Team Scramble Golf Survey</h2>
  <form id="golfForm">
    <label>Name:
      <input name="name" required>
    </label>
    <label>Course:
      <input name="course" required>
    </label>
    <label>Amount Paid:
      <input name="amount" required>
    </label>
    <label>Guest:
      <input name="guest" required>
    </label>
    <button type="submit">Submit</button>
  </form>
  <p id="message"></p>

  <script>
    document.getElementById("golfForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const form = e.target;
      const data = new URLSearchParams(new FormData(form));

      fetch("https://script.google.com/macros/s/AKfycbxhRSKKd0nLLmayJSseV1POUdmQM18nHv0CbgQR5DCN99W9yk47sFQ45UVLeMXA50Nh/exec", {
        method: "POST",
        body: data
      })
      .then(res => res.text())
      .then(text => {
        document.getElementById("message").textContent = "Submitted successfully!";
        form.reset();
      })
      .catch(err => {
        document.getElementById("message").textContent = "Error submitting form.";
        console.error(err);
      });
    });
  </script>
</body>
</html>
