
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golf Scramble Survey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      margin-top: 1.5rem;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form action="https://script.google.com/macros/s/AKfycbxhRSKKd0nLLmayJSseV1POUdmQM18nHv0CbgQR5DCN99W9yk47sFQ45UVLeMXA50Nh/exec" method="POST">
    <h2>Golf Scramble Interest Form</h2>

    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required />

    <label for="course">Nearest Course to You:</label>
    <input type="text" name="course" id="course" required />

    <label for="amount">Amount You'd Like to Pay:</label>
    <input type="text" name="amount" id="amount" required />

    <label for="guest">Will You Bring a Guest?</label>
    <input type="text" name="guest" id="guest" required />

    <button type="submit">Submit</button>
  </form>

</body>
</html>
